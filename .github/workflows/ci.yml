name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Manipulator.slnx

      - name: Build
        run: dotnet build Manipulator.slnx --configuration Release --no-restore

      - name: Format check
        run: dotnet format Manipulator.slnx --verify-no-changes --no-restore

      - name: Test
        run: dotnet test Manipulator.Api.Tests --configuration Release --no-build
