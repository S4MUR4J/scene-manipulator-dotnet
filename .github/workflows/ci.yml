name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Manipulator.slnx

      - name: Build
        run: dotnet build Manipulator.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Manipulator.Api.Tests --configuration Release --no-build
