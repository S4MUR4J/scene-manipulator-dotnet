services:
  manipulator.api:
    image: manipulator.api
    build:
      context: .
      dockerfile: Manipulator.Api/Dockerfile
    ports:
      - "8000:8080"

  manipulator.db.postgres:
    image: postgres:18.6-alpine
    restart: always
    hostname: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manipulator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:


